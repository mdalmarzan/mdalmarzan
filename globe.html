<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>MD. AL MARZAN — Global Network</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050810;
  --bg-deep:#02040a;
  --panel:rgba(9,16,32,.62);
  --panel-border:rgba(62,230,255,.18);
  --cyan:#3ee6ff;
  --violet:#7c5cff;
  --amber:#ffb454;
  --text:#e8f0ff;
  --text-dim:#6f83a6;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  font-family:'Space Grotesk',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{overscroll-behavior:none}

button{font:inherit}

#app{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100svh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,rgba(24,51,94,.18),transparent 42%),
    var(--bg);
}

#globeCanvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
  cursor:grab;
  outline:none;
}

#globeCanvas.dragging{cursor:grabbing}

.vignette,
.scanlines{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:5;
}

.vignette{
  background:radial-gradient(ellipse at center,transparent 42%,rgba(2,4,10,.58) 100%);
}

.scanlines{
  opacity:.035;
  background:repeating-linear-gradient(
    0deg,
    #fff 0,
    #fff 1px,
    transparent 1px,
    transparent 3px
  );
}

.hud{
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.hud > *{pointer-events:auto}

.brand{
  position:absolute;
  top:max(24px,env(safe-area-inset-top));
  left:max(24px,env(safe-area-inset-left));
  display:flex;
  flex-direction:column;
  gap:8px;
  max-width:calc(100vw - 280px);
}

.brand .eyebrow,
.nodes-panel h2,
.info-card .tag{
  font-family:'Orbitron',sans-serif;
  text-transform:uppercase;
}

.brand .eyebrow{
  margin:0;
  color:var(--cyan);
  opacity:.85;
  font-size:11px;
  letter-spacing:.35em;
}

.brand h1{
  margin:0;
  color:var(--text);
  font-family:'Orbitron',sans-serif;
  font-size:clamp(20px,3vw,32px);
  font-weight:700;
  letter-spacing:.04em;
  text-shadow:0 0 18px rgba(62,230,255,.35);
}

.brand .role{
  margin:0;
  color:var(--text-dim);
  font-size:13px;
  letter-spacing:.04em;
}

.status-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  width:max-content;
  margin-top:6px;
  padding:5px 12px;
  border:1px solid var(--panel-border);
  border-radius:20px;
  background:var(--panel);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--text-dim);
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.status-pill .dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#4bffa0;
  box-shadow:0 0 8px #4bffa0;
  animation:pulseDot 1.8s ease-in-out infinite;
}

@keyframes pulseDot{
  0%,100%{opacity:1}
  50%{opacity:.35}
}

.nodes-panel{
  position:absolute;
  top:max(24px,env(safe-area-inset-top));
  right:max(24px,env(safe-area-inset-right));
  width:min(236px,calc(100vw - 48px));
  max-height:calc(100dvh - 48px);
  padding:16px 14px 14px;
  border:1px solid var(--panel-border);
  border-radius:14px;
  background:var(--panel);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 30px rgba(0,0,0,.35);
}

.nodes-panel h2{
  margin:0 0 10px 2px;
  color:var(--text-dim);
  font-size:11px;
  font-weight:600;
  letter-spacing:.28em;
}

#nodeList{
  display:flex;
  flex-direction:column;
  gap:2px;
  max-height:min(44dvh,420px);
  margin:0;
  padding:0;
  overflow-y:auto;
  list-style:none;
  scrollbar-width:thin;
  scrollbar-color:rgba(62,230,255,.3) transparent;
}

#nodeList::-webkit-scrollbar{width:4px}
#nodeList::-webkit-scrollbar-thumb{
  background:rgba(62,230,255,.3);
  border-radius:4px;
}

.node-item{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:8px;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  text-align:left;
  transition:background .2s,border-color .2s;
}

.node-item:hover{
  background:rgba(62,230,255,.08);
  border-color:rgba(62,230,255,.25);
}

.node-item:focus-visible,
.close-btn:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}

.node-item.active{
  background:rgba(62,230,255,.14);
  border-color:var(--cyan);
}

.marker-dot{
  flex:0 0 auto;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);
}

.node-item.home .marker-dot{
  background:var(--amber);
  box-shadow:0 0 8px var(--amber);
}

.n-name{
  flex:1;
  min-width:0;
  overflow:hidden;
  font-weight:500;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.n-tag{
  color:var(--text-dim);
  font-size:10px;
  letter-spacing:.06em;
}

.info-card{
  position:absolute;
  left:max(24px,env(safe-area-inset-left));
  bottom:max(24px,env(safe-area-inset-bottom));
  width:min(280px,calc(100vw - 48px));
  padding:16px 18px;
  border:1px solid var(--panel-border);
  border-radius:14px;
  background:var(--panel);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 30px rgba(0,0,0,.35);
  opacity:0;
  transform:translateY(12px);
  transition:opacity .35s ease,transform .35s ease;
  pointer-events:none;
}

.info-card.show{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

.info-card .tag{
  margin:0 0 6px;
  color:var(--amber);
  font-size:10px;
  letter-spacing:.22em;
}

.info-card .tag.remote{color:var(--cyan)}

.info-card h3{
  margin:0 0 8px;
  font-size:19px;
  font-weight:600;
}

.info-card .coords{
  margin:0;
  color:var(--text-dim);
  font-size:12px;
  letter-spacing:.03em;
}

.close-btn{
  position:absolute;
  top:10px;
  right:10px;
  padding:5px;
  border:0;
  border-radius:4px;
  background:transparent;
  color:var(--text-dim);
  cursor:pointer;
  line-height:1;
}

.close-btn:hover{color:var(--text)}

.hint{
  position:absolute;
  bottom:max(22px,env(safe-area-inset-bottom));
  left:50%;
  display:flex;
  align-items:center;
  gap:10px;
  transform:translateX(-50%);
  color:var(--text-dim);
  font-size:11px;
  letter-spacing:.18em;
  opacity:.75;
  text-transform:uppercase;
  white-space:nowrap;
}

.hint .sep{color:rgba(111,131,166,.4)}

.fallback{
  position:absolute;
  inset:50% auto auto 50%;
  z-index:30;
  width:min(520px,calc(100vw - 40px));
  padding:24px;
  border:1px solid var(--panel-border);
  border-radius:16px;
  background:rgba(4,8,18,.94);
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  transform:translate(-50%,-50%);
  text-align:center;
}

.fallback[hidden]{display:none}

.fallback h2{
  margin:0 0 8px;
  font-family:'Orbitron',sans-serif;
  font-size:18px;
}

.fallback p{
  margin:0;
  color:var(--text-dim);
  line-height:1.6;
}

@media (max-width:720px){
  .brand{
    top:max(16px,env(safe-area-inset-top));
    left:max(16px,env(safe-area-inset-left));
    max-width:calc(100vw - 32px);
  }

  .brand h1{font-size:18px}
  .brand .role{font-size:12px}

  .nodes-panel{
    top:auto;
    right:max(16px,env(safe-area-inset-right));
    bottom:max(16px,env(safe-area-inset-bottom));
    width:min(205px,calc(100vw - 32px));
    padding:11px 10px;
  }

  #nodeList{max-height:31dvh}
  .info-card{bottom:max(16px,env(safe-area-inset-bottom))}
  .hint{display:none}
}

@media (max-width:460px){
  .nodes-panel{
    left:max(16px,env(safe-area-inset-left));
    right:max(16px,env(safe-area-inset-right));
    width:auto;
  }

  #nodeList{
    display:grid;
    grid-template-columns:1fr 1fr;
    max-height:24dvh;
  }

  .info-card{
    width:calc(100vw - 32px);
    bottom:calc(120px + env(safe-area-inset-bottom));
  }
}

@media (prefers-reduced-motion:reduce){
  .status-pill .dot{animation:none}
  .info-card{transition:none}
}
</style>
</head>

<body>
<div id="app">
  <canvas id="globeCanvas" aria-label="Interactive global network globe" tabindex="0"></canvas>

  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="hud">
    <header class="brand">
      <p class="eyebrow">Global Network</p>
      <h1>MD. AL MARZAN</h1>
      <p class="role">Full Stack Developer</p>
      <div class="status-pill" aria-label="Status: Online">
        <span class="dot" aria-hidden="true"></span>
        Online
      </div>
    </header>

    <aside class="nodes-panel" aria-label="Featured network nodes">
      <h2>Featured Nodes</h2>
      <ul id="nodeList"></ul>
    </aside>

    <section class="info-card" id="infoCard" aria-live="polite" aria-hidden="true">
      <button class="close-btn" id="closeInfo" type="button" aria-label="Reset view">✕</button>
      <p class="tag" id="infoTag">Remote Node</p>
      <h3 id="infoName">—</h3>
      <p class="coords" id="infoCoords">—</p>
    </section>

    <div class="hint" aria-hidden="true">
      <span>Drag to rotate</span>
      <span class="sep">·</span>
      <span>Click a node to focus</span>
    </div>
  </div>

  <div class="fallback" id="fallback" hidden>
    <h2>WebGL unavailable</h2>
    <p>This interactive globe needs WebGL. Please enable hardware acceleration or open the page in a modern browser.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  const REDUCED_MOTION = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
  const canvas = document.getElementById('globeCanvas');
  const fallback = document.getElementById('fallback');

  if (!window.THREE || !canvas) {
    fallback.hidden = false;
    return;
  }

  const LOCATIONS = Object.freeze([
    {name:'Dhaka',         lat:23.8103,  lon:90.4125,   home:true},
    {name:'San Francisco', lat:37.7749,  lon:-122.4194, home:false},
    {name:'New York',      lat:40.7128,  lon:-74.0060,  home:false},
    {name:'London',        lat:51.5074,  lon:-0.1278,   home:false},
    {name:'Berlin',        lat:52.5200,  lon:13.4050,   home:false},
    {name:'Tokyo',         lat:35.6762,  lon:139.6503,  home:false},
    {name:'Singapore',     lat:1.3521,   lon:103.8198,  home:false},
    {name:'Sydney',        lat:-33.8688, lon:151.2093,  home:false}
  ]);

  const ARC_LINKS = [[0,1],[0,3]];
  const RADIUS = 5;
  const DEFAULT_CAM_POS = new THREE.Vector3(0,1.6,14);
  const FOCUS_DISTANCE = 8.6;

  function latLonToVector3(lat, lon, radius) {
    const phi = (90 - lat) * Math.PI / 180;
    const theta = (lon + 180) * Math.PI / 180;

    return new THREE.Vector3(
      -radius * Math.sin(phi) * Math.cos(theta),
       radius * Math.cos(phi),
       radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  function easeInOutCubic(t) {
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  }

  function makeGlowTexture() {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;

    const ctx = c.getContext('2d');
    if (!ctx) return null;

    const g = ctx.createRadialGradient(
      size/2,size/2,0,
      size/2,size/2,size/2
    );

    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(.25,'rgba(255,255,255,.7)');
    g.addColorStop(1,'rgba(255,255,255,0)');

    ctx.fillStyle = g;
    ctx.fillRect(0,0,size,size);

    return new THREE.CanvasTexture(c);
  }

  let renderer;

  try {
    renderer = new THREE.WebGLRenderer({
      canvas,
      antialias:true,
      alpha:true,
      powerPreference:'high-performance'
    });
  } catch (error) {
    console.error('WebGL initialization failed:', error);
    fallback.hidden = false;
    return;
  }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45,1,.1,1000);
  camera.position.copy(DEFAULT_CAM_POS);

  function resizeRenderer() {
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(1, Math.round(rect.width));
    const height = Math.max(1, Math.round(rect.height));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setPixelRatio(dpr);
    renderer.setSize(width,height,false);
  }

  resizeRenderer();
  window.addEventListener('resize', resizeRenderer, {passive:true});

  const glowTexture = makeGlowTexture();

  scene.add(new THREE.AmbientLight(0x2a3a5c,1.4));

  const keyLight = new THREE.PointLight(0x9fd8ff,1.1,60);
  keyLight.position.set(10,8,10);
  scene.add(keyLight);

  const rimLight = new THREE.PointLight(0x7c5cff,.5,60);
  rimLight.position.set(-12,-6,-8);
  scene.add(rimLight);

  // Starfield
  const starCount = window.innerWidth < 700 ? 850 : 1600;
  const starPositions = new Float32Array(starCount * 3);

  for (let i=0;i<starCount;i++) {
    const r = 40 + Math.random()*60;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(Math.random()*2-1);

    starPositions[i*3]   = r*Math.sin(phi)*Math.cos(theta);
    starPositions[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
    starPositions[i*3+2] = r*Math.cos(phi);
  }

  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position',new THREE.BufferAttribute(starPositions,3));

  const starMat = new THREE.PointsMaterial({
    size:.28,
    map:glowTexture || undefined,
    transparent:true,
    opacity:.55,
    blending:THREE.AdditiveBlending,
    depthWrite:false,
    color:0xbfe0ff
  });

  const stars = new THREE.Points(starGeo,starMat);
  scene.add(stars);

  // Everything attached to the globe rotates together.
  const globeGroup = new THREE.Group();
  scene.add(globeGroup);

  const core = new THREE.Mesh(
    new THREE.SphereGeometry(RADIUS*.985,64,48),
    new THREE.MeshPhongMaterial({
      color:0x0a1730,
      shininess:22,
      specular:0x2b5d8f,
      transparent:true,
      opacity:.92
    })
  );
  globeGroup.add(core);

  const grid = new THREE.Mesh(
    new THREE.SphereGeometry(RADIUS*1.001,28,20),
    new THREE.MeshBasicMaterial({
      color:0x3ee6ff,
      wireframe:true,
      transparent:true,
      opacity:.14
    })
  );
  globeGroup.add(grid);

  // Atmosphere belongs to the globe group so it follows globe rotation.
  const atmosphereMat = new THREE.ShaderMaterial({
    uniforms:{glowColor:{value:new THREE.Color(0x3ee6ff)}},
    vertexShader:`
      varying vec3 vNormal;
      void main(){
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader:`
      uniform vec3 glowColor;
      varying vec3 vNormal;
      void main(){
        float intensity = pow(max(0.0,0.56-dot(vNormal,vec3(0.0,0.0,1.0))),3.0);
        gl_FragColor = vec4(glowColor,intensity);
      }
    `,
    side:THREE.BackSide,
    blending:THREE.AdditiveBlending,
    transparent:true,
    depthWrite:false
  });

  globeGroup.add(
    new THREE.Mesh(
      new THREE.SphereGeometry(RADIUS*1.18,48,36),
      atmosphereMat
    )
  );

  const markerMeshes = [];
  const beaconMeshes = [];
  const pulsePhase = [];
  const markerHitMeshes = [];

  LOCATIONS.forEach((loc,index) => {
    const pos = latLonToVector3(loc.lat,loc.lon,RADIUS);
    const normal = pos.clone().normalize();
    const color = loc.home ? 0xffb454 : 0x3ee6ff;

    const marker = new THREE.Mesh(
      new THREE.SphereGeometry(.09,16,16),
      new THREE.MeshBasicMaterial({color})
    );

    marker.position.copy(pos);
    marker.userData = {index,baseScale:1};
    globeGroup.add(marker);
    markerMeshes.push(marker);

    // Larger invisible hit area makes clicking/tapping nodes much easier.
    const hit = new THREE.Mesh(
      new THREE.SphereGeometry(.24,10,10),
      new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false})
    );
    hit.position.copy(pos);
    hit.userData = {index};
    globeGroup.add(hit);
    markerHitMeshes.push(hit);

    if (glowTexture) {
      const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map:glowTexture,
          color,
          transparent:true,
          blending:THREE.AdditiveBlending,
          depthWrite:false
        })
      );

      sprite.scale.set(.55,.55,1);
      sprite.position.copy(pos);
      globeGroup.add(sprite);
      marker.userData.sprite = sprite;
    }

    const beaconHeight = .55;
    const beacon = new THREE.Mesh(
      new THREE.CylinderGeometry(.006,.03,beaconHeight,8,1,true),
      new THREE.MeshBasicMaterial({
        color,
        transparent:true,
        opacity:.35,
        blending:THREE.AdditiveBlending,
        depthWrite:false
      })
    );

    beacon.quaternion.setFromUnitVectors(
      new THREE.Vector3(0,1,0),
      normal
    );

    beacon.position.copy(
      pos.clone().add(normal.clone().multiplyScalar(beaconHeight/2))
    );

    globeGroup.add(beacon);
    beaconMeshes.push(beacon);
    pulsePhase.push(Math.random()*Math.PI*2);
  });

  const arcPulses = [];

  ARC_LINKS.forEach(([a,b]) => {
    const v1 = latLonToVector3(LOCATIONS[a].lat,LOCATIONS[a].lon,RADIUS);
    const v2 = latLonToVector3(LOCATIONS[b].lat,LOCATIONS[b].lon,RADIUS);

    const mid = v1.clone().add(v2).multiplyScalar(.5);
    const bulge = RADIUS*.55 + v1.distanceTo(v2)*.18;
    mid.normalize().multiplyScalar(RADIUS + bulge);

    const curve = new THREE.QuadraticBezierCurve3(v1,mid,v2);
    const lineGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(64));

    globeGroup.add(
      new THREE.Line(
        lineGeo,
        new THREE.LineBasicMaterial({
          color:0x7c5cff,
          transparent:true,
          opacity:.4,
          blending:THREE.AdditiveBlending
        })
      )
    );

    const pulse = new THREE.Mesh(
      new THREE.SphereGeometry(.05,10,10),
      new THREE.MeshBasicMaterial({
        color:0xbfa8ff,
        transparent:true,
        opacity:.9,
        blending:THREE.AdditiveBlending
      })
    );

    globeGroup.add(pulse);
    arcPulses.push({curve,mesh:pulse,t:Math.random()});
  });

  // Interaction
  let isDragging = false;
  let dragged = false;
  let activeIndex = null;
  let lastX = 0;
  let lastY = 0;
  let startX = 0;
  let startY = 0;
  let velX = 0;
  let velY = 0;
  let lastInteraction = performance.now();
  let cameraAnim = null;

  const raycaster = new THREE.Raycaster();
  const mouseNDC = new THREE.Vector2();

  function stopCameraAnimation() {
    cameraAnim = null;
  }

  function setPointerDown(x,y) {
    isDragging = true;
    dragged = false;
    startX = lastX = x;
    startY = lastY = y;
    velX = 0;
    velY = 0;
    lastInteraction = performance.now();
    stopCameraAnimation();
    canvas.classList.add('dragging');
  }

  function setPointerMove(x,y) {
    if (!isDragging) return;

    const dx = x-lastX;
    const dy = y-lastY;

    if (Math.hypot(x-startX,y-startY) > 6) dragged = true;

    globeGroup.rotation.y += dx*.0045;
    globeGroup.rotation.x += dy*.0045;
    globeGroup.rotation.x = THREE.MathUtils.clamp(
      globeGroup.rotation.x,-1.05,1.05
    );

    velX = dx*.0045;
    velY = dy*.0045;
    lastX = x;
    lastY = y;
    lastInteraction = performance.now();
  }

  function setPointerUp(x,y) {
    if (!isDragging) return;

    isDragging = false;
    canvas.classList.remove('dragging');
    lastInteraction = performance.now();

    if (!dragged) handlePick(x,y);
  }

  canvas.addEventListener('pointerdown',event => {
    canvas.setPointerCapture?.(event.pointerId);
    setPointerDown(event.clientX,event.clientY);
  });

  canvas.addEventListener('pointermove',event => {
    setPointerMove(event.clientX,event.clientY);
  });

  canvas.addEventListener('pointerup',event => {
    setPointerUp(event.clientX,event.clientY);
    canvas.releasePointerCapture?.(event.pointerId);
  });

  canvas.addEventListener('pointercancel',event => {
    isDragging = false;
    dragged = false;
    canvas.classList.remove('dragging');
    canvas.releasePointerCapture?.(event.pointerId);
  });

  canvas.addEventListener('wheel',event => {
    // Keep the page fixed, but let the browser receive the gesture.
    event.preventDefault();
  },{passive:false});

  function handlePick(clientX,clientY) {
    const rect = canvas.getBoundingClientRect();

    if (!rect.width || !rect.height) return;

    mouseNDC.x = ((clientX-rect.left)/rect.width)*2-1;
    mouseNDC.y = -((clientY-rect.top)/rect.height)*2+1;

    raycaster.setFromCamera(mouseNDC,camera);

    const hits = raycaster.intersectObjects(markerHitMeshes,false);

    if (hits.length) {
      focusOnLocation(hits[0].object.userData.index);
    } else if (activeIndex !== null) {
      resetView();
    }
  }

  function animateCameraTo(targetPos,duration) {
    cameraAnim = {
      from:camera.position.clone(),
      to:targetPos.clone(),
      start:performance.now(),
      duration:Math.max(1,duration)
    };
  }

  function focusOnLocation(index) {
    if (!LOCATIONS[index]) return;

    activeIndex = index;
    lastInteraction = performance.now();

    const worldPos = new THREE.Vector3();
    markerMeshes[index].getWorldPosition(worldPos);

    // Camera is positioned on the marker's radial direction.
    const dir = worldPos.clone().normalize();
    const target = dir.multiplyScalar(FOCUS_DISTANCE);

    animateCameraTo(target,REDUCED_MOTION ? 1 : 1100);
    updateHighlight();
    showInfo(LOCATIONS[index]);
    updateListActive();
  }

  function resetView() {
    activeIndex = null;
    animateCameraTo(DEFAULT_CAM_POS,REDUCED_MOTION ? 1 : 900);
    hideInfo();
    updateHighlight();
    updateListActive();
    lastInteraction = performance.now();
  }

  function updateHighlight() {
    markerMeshes.forEach((marker,index) => {
      const active = index === activeIndex;
      const base = active ? 1.7 : 1;
      const pulse = REDUCED_MOTION ? 1 : 1 + Math.sin(performance.now()*.003 + pulsePhase[index])*.12;

      marker.scale.setScalar(base*pulse);

      if (marker.userData.sprite) {
        const s = .55*(active ? 1.5 : 1)*pulse;
        marker.userData.sprite.scale.set(s,s,1);
      }
    });
  }

  // UI
  const infoCard = document.getElementById('infoCard');
  const infoTag = document.getElementById('infoTag');
  const infoName = document.getElementById('infoName');
  const infoCoords = document.getElementById('infoCoords');
  const listEl = document.getElementById('nodeList');
  const listItems = [];

  document.getElementById('closeInfo').addEventListener('click',resetView);

  function showInfo(loc) {
    infoTag.textContent = loc.home ? 'Home Node' : 'Remote Node';
    infoTag.className = 'tag' + (loc.home ? '' : ' remote');
    infoName.textContent = loc.name;
    infoCoords.textContent =
      `${Math.abs(loc.lat).toFixed(2)}° ${loc.lat >= 0 ? 'N' : 'S'},  ` +
      `${Math.abs(loc.lon).toFixed(2)}° ${loc.lon >= 0 ? 'E' : 'W'}`;

    infoCard.classList.add('show');
    infoCard.setAttribute('aria-hidden','false');
  }

  function hideInfo() {
    infoCard.classList.remove('show');
    infoCard.setAttribute('aria-hidden','true');
  }

  LOCATIONS.forEach((loc,index) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');

    btn.type = 'button';
    btn.className = 'node-item' + (loc.home ? ' home' : '');
    btn.setAttribute('aria-label',`Focus ${loc.name}`);

    const dot = document.createElement('span');
    dot.className = 'marker-dot';
    dot.setAttribute('aria-hidden','true');

    const name = document.createElement('span');
    name.className = 'n-name';
    name.textContent = loc.name;

    btn.append(dot,name);

    if (loc.home) {
      const tag = document.createElement('span');
      tag.className = 'n-tag';
      tag.textContent = 'HOME';
      btn.appendChild(tag);
    }

    btn.addEventListener('click',() => focusOnLocation(index));
    li.appendChild(btn);
    listEl.appendChild(li);
    listItems.push(btn);
  });

  function updateListActive() {
    listItems.forEach((btn,index) => {
      const active = index === activeIndex;
      btn.classList.toggle('active',active);
      btn.setAttribute('aria-current',active ? 'true' : 'false');
    });
  }

  canvas.addEventListener('keydown',event => {
    if (event.key === 'Escape' && activeIndex !== null) {
      resetView();
    }
  });

  // Animation
  const AUTO_ROTATE_SPEED = .045;
  const PAUSE_DELAY = 1600;
  let lastFrame = performance.now();

  function tick(now) {
    requestAnimationFrame(tick);

    const delta = Math.min((now-lastFrame)/1000,.05);
    lastFrame = now;

    if (!isDragging) {
      globeGroup.rotation.y += velX;
      globeGroup.rotation.x += velY;
      globeGroup.rotation.x = THREE.MathUtils.clamp(
        globeGroup.rotation.x,-1.05,1.05
      );

      velX *= .92;
      velY *= .92;

      if (Math.abs(velX)<.00005) velX = 0;
      if (Math.abs(velY)<.00005) velY = 0;

      const idle = now-lastInteraction > PAUSE_DELAY;
      const settled = Math.abs(velX)<.0004;

      if (!REDUCED_MOTION && idle && settled && activeIndex === null) {
        globeGroup.rotation.y += AUTO_ROTATE_SPEED*delta;
      }
    }

    if (!REDUCED_MOTION) {
      markerMeshes.forEach((marker,index) => {
        const active = index === activeIndex;
        const pulse = 1 + Math.sin(now*.003 + pulsePhase[index])*.12;
        marker.scale.setScalar((active ? 1.7 : 1)*pulse);

        if (marker.userData.sprite) {
          const s = .55*(active ? 1.5 : 1)*pulse;
          marker.userData.sprite.scale.set(s,s,1);
        }
      });

      arcPulses.forEach(ap => {
        ap.t += delta*.18;
        if (ap.t > 1) ap.t -= 1;
        ap.mesh.position.copy(ap.curve.getPoint(ap.t));
      });

      stars.rotation.y += delta*.003;
    }

    if (cameraAnim) {
      const t = Math.min(
        (now-cameraAnim.start)/cameraAnim.duration,
        1
      );

      camera.position.lerpVectors(
        cameraAnim.from,
        cameraAnim.to,
        easeInOutCubic(t)
      );

      if (t >= 1) cameraAnim = null;
    }

    camera.lookAt(0,0,0);
    renderer.render(scene,camera);
  }

  updateListActive();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
